name: Build Kayan X APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Fix double android folder
        run: |
          ls -la android/
          ls -la android/android/ || true
          echo "=== Fixing structure ==="
          if [ -f "android/android/gradlew" ] && [ ! -f "android/gradlew" ]; then
            cp android/android/gradlew android/gradlew
            cp -r android/android/gradle android/gradle 2>/dev/null || cp -r android/android/gradle android/ 2>/dev/null || true
            ls -la android/
          fi
          chmod +x android/gradlew 2>/dev/null || chmod +x android/android/gradlew 2>/dev/null || true
      - name: Build APK
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "android/android/gradlew" ]; then
            cd android/android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew still not found"
            find . -name gradlew
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kayan-x-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
