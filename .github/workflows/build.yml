name: Build Kayan X APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.11
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.11
      - name: Fix native package (reserved keyword) + abiFilters
        run: |
          echo "=== Fixing abiFilters ==="
          cp android/app/build.gradle.kts android/app/build.gradle.kts.bak || true
          python3 << 'PY'
          import re, pathlib, os, shutil, glob
          # Fix build.gradle.kts abi conflict
          p = pathlib.Path("android/app/build.gradle.kts")
          if p.exists():
              text = p.read_text()
              text = re.sub(r'ndk\s*\{[^}]*abiFilters[^}]*\}', '', text, flags=re.DOTALL)
              text = re.sub(r'.*abiFilters.*\n', '', text)
              text = re.sub(r'splits\s*\{[^}]*abi[^}]*\{[^}]*\}[^}]*\}', '', text, flags=re.DOTALL)
              text = re.sub(r'splits\s*\{.*?\n\s*\}', '', text, flags=re.DOTALL)
              p.write_text(text)
          # Fix package name native -> nativelib
          base = pathlib.Path("android/app/src/main/java/com/kayanx/android")
          src_native = base / "native"
          src_new = base / "nativelib"
          if src_native.exists():
              print(f"Renaming {src_native} -> {src_new}")
              if src_new.exists():
                  shutil.rmtree(src_new)
              shutil.move(str(src_native), str(src_new))
          # Replace all imports and package declarations
          for root, dirs, files in os.walk("android"):
              for f in files:
                  if f.endswith((".kt", ".java", ".kts")):
                      fp = pathlib.Path(root) / f
                      try:
                          txt = fp.read_text()
                          orig = txt
                          txt = txt.replace("com.kayanx.android.native", "com.kayanx.android.nativelib")
                          txt = txt.replace("package com.kayanx.android.native", "package com.kayanx.android.nativelib")
                          txt = txt.replace("import com.kayanx.android.native", "import com.kayanx.android.nativelib")
                          # Also fix directory reference in CMakeLists or other
                          if orig != txt:
                              fp.write_text(txt)
                              print(f"Fixed {fp}")
                      except Exception as e:
                          print(f"Skip {fp}: {e}")
          print("Fix done")
          PY
          echo "=== After fix ==="
          ls -R android/app/src/main/java/com/kayanx/android/ | head -n 100
      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kayan-x-debug
          path: android/app/build/outputs/apk/debug/*.apk
