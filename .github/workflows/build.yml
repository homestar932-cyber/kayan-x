name: Build Kayan X APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Fix Gradle Wrapper
        run: |
          echo "=== Before fix ==="
          ls -la android/gradle/wrapper/ || true
          ls -la android/android/gradle/wrapper/ || true
          find . -name "gradle-wrapper.jar" -type f
          echo "=== Fixing ==="
          mkdir -p android/gradle/wrapper
          if [ -f "android/android/gradle/wradper/gradle-wrapper.jar" ]; then
            cp -v android/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
            cp -v android/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/ || true
          fi
          if [ -f "android/android/gradle/wrapper/gradle-wrapper.properties" ] && [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            cp -v android/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/
          fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper JAR still missing - downloading fallback"
            # download gradle wrapper jar from gradle distribution (fallback)
            curl -L -o android/gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar || true
          fi
          echo "=== After fix ==="
          ls -lh android/gradle/wrapper/
          chmod +x android/gradlew || chmod +x android/android/gradlew || true
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kayan-x-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
